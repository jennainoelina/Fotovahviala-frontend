  <div class="admin-container">

        <!-- ASIAKKAAN LUONTI (ID + salasana + kansio) -->
        <section class="admin-section">
            <h2>Luo uusi asiakas</h2>

            <label>Asiakas ID</label>
            <input id="uusiAsiakasId" type="text" placeholder="esim. asiakas123">

            <label>Salasana</label>
            <input id="uusiAsiakasSalasana" type="password" placeholder="salasana">

            <button onclick="luoAsiakas()">Luo kansio</button>
        </section>


        <!-- KUVATEN LATAUS -->
        <section class="admin-section">
            <h2>Lataa kuvia asiakkaalle</h2>

            <label>Asiakas ID</label>
            <input id="uploadAsiakasId" type="text" placeholder="esim. asiakas123">

            <label>Valitse kuvat</label>
            <input id="kuvatInput" type="file" multiple>

            <button onclick="lataaKuvat()">Lataa kuvat</button>
        </section>

        <!-- ASIAKKAAT LISTA -->
        <section class="admin-section">
            <h2>Asiakkaat</h2>

            <div id="asiakkaatLista"></div>
            
        </section>

    </div>
