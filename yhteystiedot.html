<!DOCTYPE html>
<html lang="fi">

<head>
    <title>FOTOVAHVIALA</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="tyylit.css" />
</head>

<script src="frontend.js" defer></script>

<body>

    <nav class="navi">
        <div class="logo">FOTOVAHVIALA</div>

        <ul class="menu">
            <li><a href="etusivu.html">ETUSIVU</a></li>
            <li><a href="portfolio.html">PORTFOLIO</a></li>
            <li><a href="hinnasto.html">HINNASTO</a></li>
            <li><a href="yhteystiedot.html" class="active">YHTEYSTIEDOT</a></li>
            <li><a href="kirjautuminen.html">GALLERIA</a></li>
        </ul>
    </nav>

    <div class="container">
    <h1>YHTEYSTIEDOT</h1>

    <form id="yhteyslomake">
        <input type="text" name="nimi" placeholder="Nimesi" required>
        <input type="email" name="sahkoposti" placeholder="Sähköpostisi" required>
        <textarea name="viesti" rows="6" placeholder="Kirjoita viestisi tähän..." required></textarea>
        <button type="submit">Lähetä</button>
    </form>

    <div class="info">
      <p>📍 Kellokoski, Suomi</p>
      <p>✉️ fotovahviala@gmail.com</p>
      <p> IG fotovahviala </p>
    </div>
  </div>

  <footer class="footer">
        <div class="footer-content">

            <div class="footer-left">
                <p>© 2026 FOTOVAHVIALA</p>
                <p>Y‑tunnus: 1234567-8</p>
            </div>

            <div class="footer-right">
                <a href="https://instagram.com/fotovahviala" target="_blank" rel="noopener noreferrer" title="Instagram">
                    <img src="kuvat/sivukuvat/IG.png" class="IG"alt="Instagram-logo">
                </a>
            </div>

        </div>
    </footer>

    <script>
        document
            .getElementById("yhteyslomake")
            ?.addEventListener("submit", async (e) => {

                e.preventDefault();

                const form = e.target;

                const data = {
                    nimi: form.nimi.value,
                    sahkoposti: form.sahkoposti.value,
                    viesti: form.viesti.value
                };

                const vastaus = await fetch(`${API}/api/yhteydenotto`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                if (vastaus.ok) {
                    alert("Viesti lähetetty!");
                    form.reset();
                } else {
                    alert("Lähetys epäonnistui.");
                }
            });
    </script>

</body>
